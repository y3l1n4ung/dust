sonar.projectKey=y3l1n4ung_dust
sonar.organization=y3l1n4ung
sonar.projectName=dust
sonar.sourceEncoding=UTF-8

sonar.sources=crates,packages
sonar.exclusions=**/target/**,**/.dart_tool/**,**/coverage/**,**/.coverage/**,**/*.g.dart,**/*.dart.snapshot,**/test/**,**/tests/**,**/example/**
sonar.coverage.exclusions=**/test/**,**/tests/**,**/*_test.dart,**/*.g.dart,**/*.dart.snapshot

# Two Rust reports: the `rust` job has no database, so the PostgreSQL describe
# path reads as dead there and only the postgres-fixture run measures it.
sonar.rust.lcov.reportPaths=.sonar/coverage/coverage-rust/rust.lcov,.sonar/coverage/coverage-rust-postgres/rust-postgres.lcov
sonar.dart.lcov.reportPaths=.sonar/coverage/coverage-dart-dust_dart/lcov.info,.sonar/coverage/coverage-dart-dust_db_sqlite3/lcov.info,.sonar/coverage/coverage-dart-dust_server/lcov.info,.sonar/coverage/coverage-dart-dust_db_postgres/lcov.info,.sonar/coverage/coverage-flutter-dust_flutter/lcov.info

# S8571 wants a committed `pubspec.lock` next to each pubspec. It does not
# apply to these files, and the exclusion is scoped so it applies nowhere else.
#
# Every package here is `resolution: workspace`, so pub resolves at the root and
# a member cannot hold a lock file of its own. They are also publishable
# libraries rather than applications, and Dart's guidance is that a library does
# not commit one: the constraint a consumer resolves against is the pubspec, not
# our lock. `**/pubspec.lock` has been gitignored repo-wide since before this.
#
# It surfaced now only because `dust_db_postgres/pubspec.yaml` is a new file, so
# it counted as new code. The same rule would fire on every other package.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=text:S8571
sonar.issue.ignore.multicriteria.e1.resourceKey=packages/*/pubspec.yaml
