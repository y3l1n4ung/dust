name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  release-docs:
    name: Release docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate changelog format
        shell: bash
        run: |
          set -euo pipefail

          for changelog in \
            CHANGELOG.md \
            packages/dust_dart/CHANGELOG.md \
            packages/dust_flutter/CHANGELOG.md \
            packages/dust_db_sqlite3/CHANGELOG.md \
            packages/dust_server/CHANGELOG.md
          do
            if [[ "$(sed -n '1p' "$changelog")" != "# Changelog" ]]; then
              echo "::error file=$changelog,line=1::changelog must start with '# Changelog'."
              exit 1
            fi
            if ! grep -q 'Keep a Changelog' "$changelog"; then
              echo "::error file=$changelog::changelog must state the Keep a Changelog format."
              exit 1
            fi
            if ! grep -q '^## \[Unreleased\]$' "$changelog"; then
              echo "::error file=$changelog::changelog must include an Unreleased section."
              exit 1
            fi
            if ! grep -Eq '^## \[v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' "$changelog"; then
              echo "::error file=$changelog::changelog must include dated bracketed version sections."
              exit 1
            fi
          done

          latest_tag="$(
            sed -nE 's/^## \[(v?[0-9]+\.[0-9]+\.[0-9]+)\].*/\1/p' CHANGELOG.md \
              | head -n 1
          )"
          if [[ -z "$latest_tag" ]]; then
            echo "::error::CHANGELOG.md is missing a release heading."
            exit 1
          fi

          if [[ "$latest_tag" != v* ]]; then
            latest_tag="v$latest_tag"
          fi

          awk -v tag="$latest_tag" '
            BEGIN { wanted = "## [" tag "]"; found = 0; started = 0 }
            /^## \[/ {
              if (found) exit
              if (index($0, wanted) == 1) found = 1
              next
            }
            found {
              if (!started && $0 == "") next
              started = 1
              print
            }
            END { if (!found) exit 42 }
          ' CHANGELOG.md > release-notes.md

          if grep -Eiq '^#{2,6}[[:space:]]+(install(ation)?|install or update|updates?|updated|updating|included packages|package inventory|notes|validation)\b' release-notes.md; then
            echo "::error::release notes must not include install/update, package inventory, notes, or validation sections."
            exit 1
          fi

  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$head")
          docs_only=true

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            docs_only=false
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/*|*.md|llms.txt)
                ;;
              *)
                docs_only=false
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'docs_only=%s\n' "$docs_only"

  docs-only:
    name: Docs-only / heavy CI skipped
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "Docs-only change detected; heavy CI jobs are skipped."

  installers:
    name: Installers / ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping installer validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Validate Bash installer
        if: needs.changes.outputs.docs_only != 'true' && matrix.shell == 'bash'
        shell: bash
        run: bash -n install.sh

      - name: Validate PowerShell installer
        if: needs.changes.outputs.docs_only != 'true' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $source = Get-Content -Raw install.ps1
          $null = [scriptblock]::Create($source)

  rust:
    name: Rust
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Rust validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format check
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/format.sh --check

      - name: Validate compatibility contract
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python3 scripts/validate_compatibility_contract.py --self-test
          python3 scripts/validate_compatibility_contract.py

      - name: Check source file size
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python3 scripts/check_source_size.py --self-test
          python3 scripts/check_source_size.py

      - name: Install Rust test and coverage tools
        if: needs.changes.outputs.docs_only != 'true'
        uses: taiki-e/install-action@16a76bb73558798e4218983c40c25fee9f2f99a8 # cargo-nextest, cargo-llvm-cov
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Test with a coverage floor
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/coverage.sh 90

      - name: Upload coverage
        if: needs.changes.outputs.docs_only != 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: coverage/rust.lcov
          flags: rust_engine
          name: rust_engine
          use_oidc: true

      - name: Preserve coverage for SonarQube
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: coverage/rust.lcov
          retention-days: 1

      - name: Clippy
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/lint.sh

  dart-compat-fixtures:
    name: Dart compatibility fixtures
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Dart compatibility fixtures."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Parser language-version fixtures
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p dust_parser_dart_ts --test extract_tests dart_versions -- --nocapture

      - name: Parser diagnostics fixtures
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p dust_parser_dart_ts --test extract_tests diagnostics -- --nocapture

      - name: Formatter golden fixtures
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p dust_driver --test driver_tests build_outputs::dart_versions -- --nocapture

      - name: Formatter idempotency fixtures
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test -p dust_emitter format::tests -- --nocapture

  dart-packages:
    name: Dart / ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dust_dart
            path: packages/dust_dart
            dust_check: ''
            db_check: false
            coverage_floor: '100'
          - name: dust_db_sqlite3
            path: packages/dust_db_sqlite3
            dust_check: ''
            db_check: false
            coverage_floor: '96'
          - name: dust_server
            path: packages/dust_server
            dust_check: ''
            db_check: false
            coverage_floor: '100'
          - name: product_showcase
            path: examples/product_showcase
            dust_check: examples/product_showcase
            db_check: false
            coverage_floor: ''
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Dart package validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for mixed workspace resolution
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != ''
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != ''
        run: cargo run --quiet -p dust_cli -- build --clean --root ${{ matrix.dust_check }}

      # Runs before the online build, so the cache it reads is the committed
      # one and not something this job just produced. This is the path a
      # checkout with no database takes, and the only path a Postgres project
      # can take in CI.
      - name: Dust database check from the committed query cache
        if: needs.changes.outputs.docs_only != 'true' && matrix.db_check
        run: cargo run --quiet -p dust_cli -- check --root ${{ matrix.dust_check }} --db --offline

      - name: Dust database build
        if: needs.changes.outputs.docs_only != 'true' && matrix.db_check
        run: |
          cargo run --quiet -p dust_cli -- build --root ${{ matrix.dust_check }} --db
          cargo run --quiet -p dust_cli -- check --root ${{ matrix.dust_check }} --db

      - name: Committed query cache is current
        if: needs.changes.outputs.docs_only != 'true' && matrix.db_check
        run: git diff --exit-code -- ${{ matrix.dust_check }}/.dust_sql

      - name: Analyze
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: dart analyze --fatal-infos

      - name: Test
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor == ''
        working-directory: ${{ matrix.path }}
        run: dart test

      - name: Test with a coverage floor
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        run: bash scripts/dart/coverage.sh ${{ matrix.path }} ${{ matrix.coverage_floor }}

      - name: Upload coverage
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ matrix.path }}/.coverage/lcov.info
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          use_oidc: true

      - name: Preserve coverage for SonarQube
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-dart-${{ matrix.name }}
          path: ${{ matrix.path }}/.coverage/lcov.info
          include-hidden-files: true
          retention-days: 1

  flutter-packages:
    name: Flutter / ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dust_flutter
            path: packages/dust_flutter
            dust_check: ''
            db_check: false
            strict_generated: false
            coverage_floor: '90'
          - name: benchmark_project
            path: examples/benchmark_project
            dust_check: examples/benchmark_project
            db_check: false
            strict_generated: false
            coverage_floor: ''
          - name: shopping_app
            path: examples/shopping_app
            dust_check: examples/shopping_app
            db_check: true
            strict_generated: true
            coverage_floor: ''
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Flutter package validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true' && (matrix.dust_check != '' || matrix.db_check)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: flutter pub get

      - name: Generate benchmark fixtures
        if: needs.changes.outputs.docs_only != 'true' && matrix.path == 'examples/benchmark_project'
        working-directory: examples/benchmark_project
        run: dart tool/generate.dart --count 10

      - name: Build benchmark generated outputs
        if: needs.changes.outputs.docs_only != 'true' && matrix.path == 'examples/benchmark_project'
        run: cargo run --quiet -p dust_cli -- build --clean --root examples/benchmark_project

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != '' && matrix.path != 'examples/benchmark_project'
        run: cargo run --quiet -p dust_cli -- build --clean --root ${{ matrix.dust_check }}

      - name: Dust DB build
        if: needs.changes.outputs.docs_only != 'true' && matrix.db_check
        run: cargo run --quiet -p dust_cli -- build --root ${{ matrix.path }} --db

      - name: Strict analyze generated Flutter output
        if: needs.changes.outputs.docs_only != 'true' && matrix.strict_generated
        run: python3 scripts/strict_generated_analyze.py --package ${{ matrix.path }} --tool flutter

      - name: Analyze
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: flutter analyze --no-pub

      - name: Test
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor == ''
        working-directory: ${{ matrix.path }}
        run: flutter test

      - name: Test with a coverage floor
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        run: bash scripts/flutter/coverage.sh ${{ matrix.path }} ${{ matrix.coverage_floor }}

      - name: Upload coverage
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          disable_search: true
          fail_ci_if_error: true
          files: ${{ matrix.path }}/coverage/lcov.info
          flags: ${{ matrix.name }}
          name: ${{ matrix.name }}
          use_oidc: true

      - name: Preserve coverage for SonarQube
        if: needs.changes.outputs.docs_only != 'true' && matrix.coverage_floor != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-flutter-${{ matrix.name }}
          path: ${{ matrix.path }}/coverage/lcov.info
          retention-days: 1

  sonarqube:
    name: SonarQube
    needs:
      - changes
      - rust
      - dart-packages
      - flutter-packages
      - postgres-fixture
    if: >-
      needs.changes.outputs.docs_only != 'true' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverage-*
          path: .sonar/coverage

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  serde-analyze:
    name: SerDe analyzer fixture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping SerDe analyzer fixture."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for Dart tooling
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate strict generated analyzer
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --self-test

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run --quiet -p dust_cli -- build --clean --root fixtures/serde_json_app

      - name: Analyze generated SerDe output
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart analyze --fatal-infos

      - name: Strict analyze generated SerDe output
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --package fixtures/serde_json_app --tool dart

      - name: Test generated SerDe runtime
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart test

  postgres-fixture:
    name: PostgreSQL fixture
    needs: changes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dust
          POSTGRES_PASSWORD: dust
          POSTGRES_DB: dust_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dust"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DUST_DATABASE_URL: postgres://dust:dust@localhost:5432/dust_test?sslmode=disable
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping the PostgreSQL fixture."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for mixed workspace resolution
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        run: dart pub get

      # Runs before the online build, so the cache read is the committed one.
      # This is the path a checkout with no database takes, and the only path
      # available to a project whose SQL cannot be described without a server.
      - name: Validate from the committed query cache
        if: needs.changes.outputs.docs_only != 'true'
        env:
          DUST_DATABASE_URL: ''
        run: cargo run --quiet -p dust_cli -- check --root fixtures/postgres_app --db --offline

      - name: Dust build against PostgreSQL
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cargo run --quiet -p dust_cli -- build --clean --root fixtures/postgres_app
          cargo run --quiet -p dust_cli -- build --root fixtures/postgres_app --db
          cargo run --quiet -p dust_cli -- check --root fixtures/postgres_app --db

      - name: Committed query cache is current
        if: needs.changes.outputs.docs_only != 'true'
        run: git diff --exit-code -- fixtures/postgres_app/.dust_sql

      - name: Analyze generated PostgreSQL output
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/postgres_app
        run: dart analyze --fatal-infos

      - name: Test the fixture against PostgreSQL
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/postgres_app
        run: dart test

      # The engine's PostgreSQL describe path — connecting, the scratch schema,
      # migrations, rollback — cannot run in the `rust` job, which has no
      # database. These tests return early without `DUST_DATABASE_URL`, so this
      # is the only place they do anything.
      - name: Install Rust coverage tools
        if: needs.changes.outputs.docs_only != 'true'
        uses: taiki-e/install-action@16a76bb73558798e4218983c40c25fee9f2f99a8 # cargo-nextest, cargo-llvm-cov
        with:
          tool: cargo-nextest,cargo-llvm-cov

      - name: Test the PostgreSQL validation path against a server
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          mkdir -p coverage
          cargo llvm-cov nextest -p dust_db_plugin \
            --lcov --output-path coverage/rust-postgres.lcov

      # The `rust` job has no database, so the PostgreSQL describe path reads as
      # dead there. This report is the half only this job can measure.
      - name: Preserve PostgreSQL engine coverage for SonarQube
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust-postgres
          path: coverage/rust-postgres.lcov
          retention-days: 1

      - name: Test the PostgreSQL runtime against a server
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: packages/dust_db_postgres
        run: dart test

      # `example/postgres_database.dart` is the one dust_server example that
      # cannot run in the package matrix, which has no database. Skipped there,
      # so this is the only job that actually serves PostgreSQL over HTTP.
      - name: Serve PostgreSQL through dust_server
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: packages/dust_server
        run: dart test test/example/examples_test.dart --plain-name postgres_database

      # The runtime is only exercised with a server, so its coverage floor
      # belongs here rather than in the package matrix, which has none.
      - name: PostgreSQL runtime coverage
        if: needs.changes.outputs.docs_only != 'true'
        run: bash scripts/dart/coverage.sh packages/dust_db_postgres 100

      # Only this job can produce it, and without it Sonar counts every line of
      # a package at 100% coverage as uncovered.
      - name: Preserve PostgreSQL runtime coverage for SonarQube
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-dart-dust_db_postgres
          path: packages/dust_db_postgres/.coverage/lcov.info
          include-hidden-files: true
          retention-days: 1

  http-analyze:
    name: HTTP analyzer fixture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping HTTP analyzer fixture."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for Dart tooling
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run --quiet -p dust_cli -- build --clean --root fixtures/http_client_app

      - name: Analyze generated HTTP output
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart analyze --fatal-infos

      - name: Strict analyze generated HTTP output
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --package fixtures/http_client_app --tool dart

      - name: Test generated HTTP requests
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart test

  benchmark:
    name: Benchmark / benchmark_project
    needs: changes
    runs-on: ubuntu-latest
    env:
      DUST_PERF_COLD_MAX_MS: 3500
      DUST_PERF_WARM_MAX_MS: 1500
      DUST_PERF_INVALIDATED_MAX_MS: 3000
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping benchmark."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: examples/benchmark_project
        run: flutter pub get

      - name: Build release CLI
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo build --quiet -p dust_cli --release

      - name: Run ignored perf test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          DUST_PERF_CLI_BIN: target/release/dust
        run: cargo test -p dust_cli benchmark_project_release_build_benchmark -- --ignored --nocapture
