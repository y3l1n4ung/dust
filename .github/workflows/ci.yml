name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  changes:
    name: Change classification
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect docs-only change
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-list --max-parents=0 "$head")"
          fi

          mapfile -t changed_files < <(git diff --name-only "$base" "$head")
          docs_only=true

          if [[ "${#changed_files[@]}" -eq 0 ]]; then
            docs_only=false
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              docs/*|release-notes/*|*.md|llms.txt)
                ;;
              *)
                docs_only=false
                ;;
            esac
          done

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          printf 'docs_only=%s\n' "$docs_only"

  docs-only:
    name: Docs-only / heavy CI skipped
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: echo "Docs-only change detected; heavy CI jobs are skipped."

  installers:
    name: Installers / ${{ matrix.os }}
    needs: changes
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            shell: bash
          - os: windows-latest
            shell: pwsh
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping installer validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Validate Bash installer
        if: needs.changes.outputs.docs_only != 'true' && matrix.shell == 'bash'
        shell: bash
        run: bash -n install.sh

      - name: Validate PowerShell installer
        if: needs.changes.outputs.docs_only != 'true' && matrix.shell == 'pwsh'
        shell: pwsh
        run: |
          $source = Get-Content -Raw install.ps1
          $null = [scriptblock]::Create($source)

  rust:
    name: Rust
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Rust validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Format check
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/format.sh --check

      - name: Validate compatibility contract
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          python3 scripts/validate_compatibility_contract.py --self-test
          python3 scripts/validate_compatibility_contract.py

      - name: Install cargo-nextest
        if: needs.changes.outputs.docs_only != 'true'
        uses: taiki-e/install-action@16a76bb73558798e4218983c40c25fee9f2f99a8 # nextest

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/test.sh

      - name: Clippy
        if: needs.changes.outputs.docs_only != 'true'
        run: ./scripts/rust/lint.sh

  dart-packages:
    name: Dart / ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dust_dart
            path: packages/dust_dart
            dust_check: ''
          - name: dust_db_sqlite3
            path: packages/dust_db_sqlite3
            dust_check: ''
          - name: product_showcase
            path: examples/product_showcase
            dust_check: examples/product_showcase
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Dart package validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for mixed workspace resolution
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != ''
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != ''
        run: cargo run --quiet -p dust_cli -- build --clean --root ${{ matrix.dust_check }}

      - name: Analyze
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: dart analyze --fatal-infos

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: dart test

  flutter-packages:
    name: Flutter / ${{ matrix.name }}
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: dust_flutter
            path: packages/dust_flutter
            dust_check: ''
            db_check: false
            strict_generated: false
          - name: benchmark_project
            path: examples/benchmark_project
            dust_check: examples/benchmark_project
            db_check: false
            strict_generated: false
          - name: shopping_app
            path: examples/shopping_app
            dust_check: examples/shopping_app
            db_check: true
            strict_generated: true
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping Flutter package validation."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true' && (matrix.dust_check != '' || matrix.db_check)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: flutter pub get

      - name: Generate benchmark fixtures
        if: needs.changes.outputs.docs_only != 'true' && matrix.path == 'examples/benchmark_project'
        working-directory: examples/benchmark_project
        run: dart tool/generate.dart --count 10

      - name: Build benchmark generated outputs
        if: needs.changes.outputs.docs_only != 'true' && matrix.path == 'examples/benchmark_project'
        run: cargo run --quiet -p dust_cli -- build --clean --root examples/benchmark_project

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true' && matrix.dust_check != '' && matrix.path != 'examples/benchmark_project'
        run: cargo run --quiet -p dust_cli -- build --clean --root ${{ matrix.dust_check }}

      - name: Dust DB build
        if: needs.changes.outputs.docs_only != 'true' && matrix.db_check
        run: cargo run --quiet -p dust_cli -- build --root ${{ matrix.path }} --db

      - name: Strict analyze generated Flutter output
        if: needs.changes.outputs.docs_only != 'true' && matrix.strict_generated
        run: python3 scripts/strict_generated_analyze.py --package ${{ matrix.path }} --tool flutter

      - name: Analyze
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: flutter analyze --no-pub

      - name: Test
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: ${{ matrix.path }}
        run: flutter test

  serde-analyze:
    name: SerDe analyzer fixture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping SerDe analyzer fixture."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for Dart tooling
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Validate strict generated analyzer
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --self-test

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run --quiet -p dust_cli -- build --clean --root fixtures/serde_json_app

      - name: Analyze generated SerDe output
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart analyze --fatal-infos

      - name: Strict analyze generated SerDe output
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --package fixtures/serde_json_app --tool dart

      - name: Test generated SerDe runtime
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/serde_json_app
        run: dart test

  http-analyze:
    name: HTTP analyzer fixture
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping HTTP analyzer fixture."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter SDK for Dart tooling
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart pub get

      - name: Dust clean build
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run --quiet -p dust_cli -- build --clean --root fixtures/http_client_app

      - name: Analyze generated HTTP output
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart analyze --fatal-infos

      - name: Strict analyze generated HTTP output
        if: needs.changes.outputs.docs_only != 'true'
        run: python3 scripts/strict_generated_analyze.py --package fixtures/http_client_app --tool dart

      - name: Test generated HTTP requests
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: fixtures/http_client_app
        run: dart test

  benchmark:
    name: Benchmark / benchmark_project
    needs: changes
    runs-on: ubuntu-latest
    env:
      DUST_PERF_COLD_MAX_MS: 3500
      DUST_PERF_WARM_MAX_MS: 1500
      DUST_PERF_INVALIDATED_MAX_MS: 3000
    steps:
      - name: Skip docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "Docs-only change detected; skipping benchmark."

      - name: Checkout
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/checkout@v4

      - name: Setup Flutter
        if: needs.changes.outputs.docs_only != 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install Rust toolchain
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Pub get
        if: needs.changes.outputs.docs_only != 'true'
        working-directory: examples/benchmark_project
        run: flutter pub get

      - name: Build release CLI
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo build --quiet -p dust_cli --release

      - name: Run ignored perf test
        if: needs.changes.outputs.docs_only != 'true'
        env:
          DUST_PERF_CLI_BIN: target/release/dust
        run: cargo test -p dust_cli benchmark_project_release_build_benchmark -- --ignored --nocapture
